# Baseline config for a real training run on a Kaggle GPU notebook.
# base_channels=32 matches FilamentUNet's documented default (see
# src/filament/models/unet.py); epochs/batch_size are starting points to be
# tuned once real validation PQ is measurable, not final values.
json_path: data/MAGFiLO_1.0_Annotations_kaggle2026_train.json
cache_dir: data/cache
checkpoint_dir: outputs/baseline
val_fraction: 0.15
test_fraction: 0.15
base_channels: 32
batch_size: 8
epochs: 60
lr: 0.001
lr_step_epochs: 20
lr_gamma: 0.5
num_workers: 2
device: cuda
seed: 0
